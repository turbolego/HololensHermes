# Compile check: verifies the UWP project builds on both configurations.
# Packaging and signing are disabled so no certificate is required.
# For the signed .appx artifact see dotnet-desktop.yml.

name: UWP Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # The windows-2022 runner ships with SDK 10.0.19041 but without the
      # References/WinMD component, causing WMC1006 in MarkupCompilePass1.
      # This step adds the two missing VS components (~300 MB, idempotent):
      #   Windows10SDK.19041           – WinMD contract files
      #   UWP.MSBuild                  – XAML compiler MSBuild targets
      - name: Install Windows 10 SDK 19041 and UWP MSBuild tools
        shell: powershell
        run: |
          $vswhere   = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath    = & $vswhere -latest -products * -property installationPath
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          & $installer modify `
            --installPath "$vsPath" `
            --add Microsoft.VisualStudio.Component.Windows10SDK.19041 `
            --add Microsoft.VisualStudio.ComponentGroup.UWP.MSBuild `
            --quiet --norestart --force
          # 0 = success; 3010 = success, restart deferred (fine in CI)
          if ($LASTEXITCODE -notin @(0, 3010)) { exit $LASTEXITCODE }

      - name: Build ${{ matrix.configuration }} | x86
        run: >
          msbuild HoloLensHello.csproj /m
          /p:Configuration=${{ matrix.configuration }}
          /p:Platform=x86
          /p:AppxPackageSigningEnabled=false
          /p:GenerateAppxPackageOnBuild=false
